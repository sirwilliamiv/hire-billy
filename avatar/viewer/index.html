<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Billy Bust — sculpt viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #f5f5f5; overflow: hidden; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import {
  createBillyPortraitBustModel,
  applyBillySkin,
  createBillyPortraitBustLookDevLights,
  createBillyPortraitBustEnvironment,
  configureBillyPortraitBustRenderer,
} from './createBillyBustModel.js';
import { createMatrixSkin, createLikenessSkin, createClaySkin } from './skins.js';

const params = new URLSearchParams(location.search);
const yaw = parseFloat(params.get('yaw') ?? '0') * Math.PI / 180;
const pitch = parseFloat(params.get('pitch') ?? '0') * Math.PI / 180;
const dist = parseFloat(params.get('dist') ?? '3.4');
const fov = parseFloat(params.get('fov') ?? '40');
const targetY = parseFloat(params.get('ty') ?? '-0.15');

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);
configureBillyPortraitBustRenderer(renderer);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf5f5f5);
scene.environment = createBillyPortraitBustEnvironment(renderer);

const model = createBillyPortraitBustModel();
scene.add(model);
scene.add(createBillyPortraitBustLookDevLights());

if (params.get('flat') === '1') {
  // map-stripped evidence mode: unlit flat colors, geometry only
  model.traverse((o) => {
    if (o.isMesh) o.material = new THREE.MeshBasicMaterial({ color: o.material.color });
  });
}

let activeSkin = null;
const skinName = params.get('skin');
if (skinName === 'matrix') {
  activeSkin = createMatrixSkin('./likeness-albedo.png', () => {
    renderer.render(scene, camera);
    window.__SKIN_READY = true;
  });
  applyBillySkin(model, activeSkin);
  scene.background = new THREE.Color(0x04080a);
} else if (skinName === 'likeness') {
  activeSkin = createLikenessSkin('./likeness-albedo.png', () => {
    renderer.render(scene, camera);
    window.__SKIN_READY = true;
  });
  applyBillySkin(model, activeSkin);
} else if (skinName === 'clay') {
  applyBillySkin(model, createClaySkin());
}

const camera = new THREE.PerspectiveCamera(fov, innerWidth / innerHeight, 0.01, 100);
const target = new THREE.Vector3(0, targetY, 0);
camera.position.set(
  target.x + dist * Math.sin(yaw) * Math.cos(pitch),
  target.y + dist * Math.sin(pitch),
  target.z + dist * Math.cos(yaw) * Math.cos(pitch),
);
camera.lookAt(target);

renderer.render(scene, camera);
window.__READY = true;
window.__RUNTIME = model.userData.sculptRuntime;

if (activeSkin && activeSkin.update) {
  const t0 = performance.now();
  (function loop() {
    activeSkin.update((performance.now() - t0) / 1000);
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  })();
}
</script>
</body>
</html>
