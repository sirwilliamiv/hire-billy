:root{--ink:#0C0B08;--paper:#F4F3EE;--paper2:#E9E7DF;--line:#DBD7CB;--soft:#57534A;
  --det:#2B47FF;--inf:#CBFF4D;--void:#06070A;
  --serif:'Instrument Serif',Georgia,serif;--data:'Martian Mono',ui-monospace,monospace}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--void);overflow:hidden;transition:background 1.6s ease;
  font:15px/1.55 "Instrument Sans",system-ui,sans-serif;color:var(--ink)}
body.lit{background:var(--paper)}
#waiting{position:fixed;inset:0;display:grid;place-items:center;color:#3a3d4a;
  font:italic 22px/1.4 var(--serif);transition:opacity .8s}
body.lit #waiting{opacity:0;pointer-events:none}
#rainbg{position:fixed;inset:0;opacity:0;transition:opacity 1.2s;pointer-events:none}
#rainbg.on{opacity:1}
#door{position:fixed;left:110px;width:120px;height:212px;perspective:700px;opacity:0;transition:opacity 1.2s}
#door.show{opacity:1}
#door .framebox{position:absolute;inset:-7px;border:7px solid var(--paper);border-radius:10px 10px 0 0;border-bottom:none;box-shadow:0 14px 44px rgba(0,0,0,.5)}
body.lit #door .framebox{border-color:var(--ink)}
#door .opening{position:absolute;inset:0;background:#000;overflow:hidden}
#door .opening canvas{width:100%;height:100%;display:block}
#door .panel{position:absolute;inset:0;background:var(--paper2);border:2px solid var(--line);
  transform-origin:left center;transition:transform .8s cubic-bezier(.6,.05,.3,1)}
#door.open .panel{transform:rotateY(-80deg)}
#fig{position:fixed;width:126px;height:245px;opacity:0;transition:transform 2.4s cubic-bezier(.45,.05,.55,.95)}
#fig img{position:absolute}
#pBody{left:17.5px;top:0;height:137px;z-index:2}
.pleg{position:absolute;top:134px;width:97px;height:111px}
#plF{left:31px;transform-origin:33.5px 1px;z-index:1}
#plB{left:0;transform-origin:64.5px 1px}
.pthigh{top:0;height:54px}
#plF .pthigh{left:0}#plB .pthigh{left:17px}
.pshin{position:absolute;top:51px;width:97px;height:60px}
#plF .pshin{left:15.5px;transform-origin:35px 2px}
#plB .pshin{left:0;transform-origin:44px 2px}
.pshin img{height:60px}
#skSit{position:absolute;left:14px;top:31px;height:210px;display:none}
.seated #pBody,.seated .pleg{display:none}
.seated #skSit{display:block}
.walking #plF{animation:thF .44s ease-in-out infinite alternate}
.walking #plB{animation:thB .44s ease-in-out infinite alternate}
.walking #plF .pshin{animation:shF .44s ease-in-out infinite alternate}
.walking #plB .pshin{animation:shB .44s ease-in-out infinite alternate}
@keyframes thF{from{transform:rotate(-14deg)}to{transform:rotate(8deg)}}
@keyframes thB{from{transform:rotate(14deg)}to{transform:rotate(-8deg)}}
@keyframes shF{from{transform:rotate(2deg)}to{transform:rotate(24deg)}}
@keyframes shB{from{transform:rotate(24deg)}to{transform:rotate(2deg)}}
#ledge{position:fixed;height:11px;width:172px;background:var(--paper2);border:2px solid var(--ink);
  border-radius:7px;box-shadow:0 7px 18px rgba(6,7,10,.28);opacity:0;transition:opacity .5s}
#ledge.on{opacity:1}
#card{position:fixed;right:6vw;top:16vh;width:min(430px,42vw);opacity:0;transform:translateY(12px);
  transition:opacity .7s,transform .7s;background:var(--paper);border:1.5px solid var(--line);
  border-radius:16px;padding:20px 22px;box-shadow:0 16px 44px rgba(6,7,10,.14)}
body.lit #card.on{opacity:1;transform:none}
#card h1{font:28px/1.2 var(--serif);margin-bottom:8px}
#card p{color:var(--soft);font-size:14px;margin-bottom:12px}
.chip{font-size:13px;background:var(--paper2);color:var(--ink);border:1px solid var(--line);
  border-radius:999px;padding:7px 13px;cursor:pointer;margin:0 6px 8px 0}
.chip:hover{border-color:var(--det)}
#ans{display:none;margin-top:6px}
#ans .lede{font:20px/1.25 var(--serif);margin-bottom:6px}
#ans .rest{font-size:13.5px;color:var(--soft);white-space:pre-wrap}
#ans .rest del{color:#FF4A38}
#ans .rec{font:10.5px/1.6 var(--data);color:#8F897C;border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
</style>

<script>
(function(){
"use strict";
var BRAIN = "__BRAIN__", TOKEN = "__TOKEN__";
var api = "http://127.0.0.1:" + BRAIN;
var floorY = () => Math.round(innerHeight * 0.72);
var door = document.getElementById("door"), fig = document.getElementById("fig");

door.style.top = (floorY() - 212) + "px";

function chromeTop(){ return (window.outerHeight - window.innerHeight); }
function doorScreen(){
  var r = door.getBoundingClientRect();
  return { type: "door-ready",
           x: Math.round(window.screenX + r.left + r.width/2),
           y: Math.round(window.screenY + chromeTop() + r.top + r.height) };
}
function post(m){ fetch(api + "/stage", {method:"POST",
  headers:{"content-type":"application/json","x-billy-token":TOKEN}, body: JSON.stringify(m)}).catch(function(){}); }
post(doorScreen());
setInterval(function(){ post(doorScreen()); }, 1000);

/* rain engines */
function rain(cv, fs, interval){
  var dpr = devicePixelRatio||1, W = cv.offsetWidth, H = cv.offsetHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  var ctx = cv.getContext("2d"); ctx.scale(dpr,dpr);
  ctx.fillStyle="#000"; ctx.fillRect(0,0,W,H);
  var cols = Math.ceil(W/fs), drops = [];
  for(var i=0;i<cols;i++) drops[i] = Math.floor(Math.random()*-H/fs);
  var CH="01アイウエオカキクケコサシスセソタチツ<>/{}=+*";
  return setInterval(function(){
    ctx.fillStyle="rgba(0,0,0,.16)"; ctx.fillRect(0,0,W,H);
    ctx.font = fs+"px 'Martian Mono',monospace";
    for(var i=0;i<cols;i++){
      var b = Math.random();
      ctx.fillStyle = b>.88?"#fff":"rgba(255,255,255,"+(0.18+b*0.4).toFixed(2)+")";
      ctx.fillText(CH[Math.floor(Math.random()*CH.length)], i*fs, drops[i]*fs);
      if(drops[i]*fs>H && Math.random()>0.92) drops[i]=0;
      drops[i]++;
    }
  }, interval);
}
var doorRain = null, bgRain = null;

/* the crossing */
var es = new EventSource(api + "/stage-events?t=" + TOKEN);
es.onmessage = function(ev){
  var m = {}; try{ m = JSON.parse(ev.data); }catch(e){ return; }
  if(m.type === "crossing") arrive();
};
var arrived = false;
function arrive(){
  if(arrived) return; arrived = true;
  door.classList.add("show");
  doorRain = rain(document.getElementById("rain"), 10, 70);
  var bg = document.getElementById("rainbg");
  bg.classList.add("on");
  bgRain = rain(bg, 14, 60);
  setTimeout(function(){ door.classList.add("open"); }, 900);
  setTimeout(function(){
    var dr = door.getBoundingClientRect();
    var startX = dr.left + dr.width/2 - 63, startY = floorY() - 245;
    fig.style.transition = "none";
    fig.style.left = startX + "px"; fig.style.top = startY + "px";
    fig.getBoundingClientRect();
    fig.style.opacity = 1;
    fig.style.transition = "";
    fig.classList.add("walking");
    var targetX = Math.round(innerWidth*0.42) - 63;
    setTimeout(function(){ fig.style.left = targetX + "px"; }, 60);
    fig.addEventListener("transitionend", function step(ev2){
      if(ev2.propertyName !== "left") return;
      fig.removeEventListener("transitionend", step);
      fig.classList.remove("walking");
      /* lights up: rain out, paper in */
      document.body.classList.add("lit");
      setTimeout(function(){ bg.classList.remove("on"); clearInterval(bgRain); }, 1400);
      door.classList.remove("open");
      /* sit on the ledge */
      var lx = targetX + 63 - 86, ly = floorY() - 245 + 113 + 99 - 99; /* palms line */
      fig.classList.add("seated");
      fig.style.transition = "top .45s cubic-bezier(.34,1.4,.64,1)";
      fig.style.top = (floorY() - 245 + 4) + "px";
      var ledge = document.getElementById("ledge");
      ledge.style.left = (targetX + 63 - 86) + "px";
      ledge.style.top = (floorY() - 245 + 4 + 31 + 99) + "px";
      ledge.classList.add("on");
      setTimeout(function(){ document.getElementById("card").classList.add("on"); }, 700);
    });
  }, 1700);
}

/* asks through the brain */
var CHIPS = ["What are your biggest weaknesses?","Why should we not hire you?","What have you actually built?","Why should we hire you?"];
CHIPS.forEach(function(c){
  var b = document.createElement("button");
  b.className = "chip"; b.textContent = c;
  b.onclick = function(){
    fetch(api + "/ask", {method:"POST", headers:{"content-type":"application/json","x-billy-token":TOKEN},
      body: JSON.stringify({question:c})})
    .then(function(r){ return r.json(); })
    .then(function(s){
      var a = document.getElementById("ans");
      a.style.display = "block";
      a.querySelector(".lede").textContent = s.lede || "";
      a.querySelector(".rest").innerHTML = (s.rest||"").replace(/[&<>]/g,function(ch){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[ch]}).replace(/~~(.+?)~~/g,"<del>$1</del>");
      a.querySelector(".rec").textContent = s.receipt || "";
    })
    .catch(function(){ 
      var a = document.getElementById("ans");
      a.style.display = "block";
      a.querySelector(".lede").textContent = "The brain hung up.";
      a.querySelector(".rest").textContent = "The MCP server that fact-checks me has gone quiet. I decline to improvise.";
    });
  };
  document.getElementById("chips").appendChild(b);
});
})();
</script>
</body>
</html>
