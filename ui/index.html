<main>
  <h1>MCP gives an agent context. EAP gives it a body.</h1>
  <p>This server is a stage. The actor appears on the desktop of the machine that summoned him,
     not in a browser tab — add <code>mcp/server.js</code> to a local MCP client and call
     <code>stage_summon</code>.</p>
  <p><a href="https://github.com/sirwilliamiv/embodied-agent-protocol">the protocol</a> ·
     <a href="https://github.com/sirwilliamiv/eap-stage">this implementation</a></p>
  <p style="color:#555">The actor never clicks.</p>
