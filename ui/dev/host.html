<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>eap-stage widget harness</title>
<style>
  body{margin:0;font:14px/1.5 -apple-system,sans-serif;background:#262624;display:flex;justify-content:center;min-height:100vh}
  .chat{width:700px;max-width:96vw;background:#30302e;margin:20px 0;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
  .msg{background:#3d3d3b;color:#eee;border-radius:12px;padding:10px 14px;max-width:75%}
  .msg.user{align-self:flex-end;background:#4a4a6a}
  iframe{border:0;width:100%;border-radius:12px;background:transparent;height:430px;transition:height .3s}
  .input{background:#3d3d3b;border-radius:12px;padding:12px 14px;color:#888}
  .bar{position:fixed;top:8px;left:8px;display:flex;gap:8px;z-index:9}
  .bar button{font:12px monospace;padding:4px 10px;border-radius:8px;border:0;cursor:pointer}
</style>
</head>
<body>
<div class="bar">
  <button onclick="setTheme('light')">light</button>
  <button onclick="setTheme('dark')">dark</button>
  <button onclick="setW(700)">wide</button>
  <button onclick="setW(380)">narrow</button>
  <button onclick="load('panel')">ask panel</button>
  <button onclick="load('summon','inline')">summon: inline</button>
  <button onclick="load('summon','desktop')">summon: desktop</button>
  <button onclick="reload()">reload</button>
</div>
<div class="chat" id="chat">
  <div class="msg user" id="prompt">use eap-stage to tell me about this candidate</div>
  <div class="msg" id="calling">Calling ask_candidate…</div>
  <iframe id="f" src="/widget?autostart=1" allowtransparency="true"></iframe>
  <div class="input">Reply to Claude…</div>
</div>
<script>
var theme = 'dark';
/* which surface is in the frame, and (for summon) what the tool was asked to
   do: the card only runs the desktop receipt when a real result says so, so
   the harness calls the tool for real and forwards it like a host would */
var surface = 'panel', want = null;
function setTheme(t){ theme = t; post({jsonrpc:'2.0',method:'ui/notifications/host-context-changed',params:{theme:t}}); }
function setW(w){ document.getElementById('chat').style.width = w + 'px'; }
function load(kind, platform){
  surface = kind; want = platform || null;
  document.getElementById('prompt').textContent = kind === 'summon' ? 'summon the actor' : 'use eap-stage to tell me about this candidate';
  document.getElementById('calling').textContent = 'Calling ' + (kind === 'summon' ? 'stage_summon…' : 'ask_candidate…');
  reload();
}
function reload(){
  document.getElementById('f').src = (surface === 'summon' ? '/summon?r=' : '/widget?autostart=1&r=') + Math.random();
}
function post(m){ document.getElementById('f').contentWindow.postMessage(m, '*'); }
async function callTool(name, args){
  var r = await fetch('/mcp', {method:'POST',
    headers:{'content-type':'application/json', accept:'application/json, text/event-stream'},
    body: JSON.stringify({jsonrpc:'2.0', id:99, method:'tools/call', params:{name:name, arguments:args}})});
  return (await r.json()).result;
}
window.addEventListener('message', async function(e){
  var m = e.data; if(!m || m.jsonrpc !== '2.0') return;
  console.log('[widget->host]', JSON.stringify(m).slice(0, 200));
  if(m.method === 'ui/initialize'){
    post({jsonrpc:'2.0', id:m.id, result:{hostContext:{theme:theme, containerDimensions:{width:document.getElementById('f').clientWidth}}}});
    if(surface === 'summon'){
      /* the remote transport can only ever answer "inline", so previewing the
         receipt state means sending the bare mode the local stdio server would
         send and letting the card supply its own desktop copy */
      var res = want === 'desktop'
        ? {structuredContent:{mode:'desktop'}}
        : await callTool('stage_summon', want ? {platform:want} : {});
      post({jsonrpc:'2.0', method:'ui/notifications/tool-result', params:res});
    }
    return;
  }
  if(m.method === 'tools/call'){
    try{
      return post({jsonrpc:'2.0', id:m.id, result: await callTool(m.params.name, m.params.arguments)});
    }catch(err){
      return post({jsonrpc:'2.0', id:m.id, error:{code:-32000, message:String(err)}});
    }
  }
  if(m.method === 'ui/notifications/size-changed' && m.params && m.params.height){
    document.getElementById('f').style.height = Math.min(m.params.height, 640) + 'px';
  }
});
</script>
</body>
</html>
