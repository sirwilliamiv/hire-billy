:root{ --blue:#2B47FF; --lime:#CBFF4D; --ink:#0C0B08; --card:#F4F3EE; --paper2:#E9E7DF;
  --line:#DBD7CB; --del:#FF4A38; --soft:#57534A; --soft3:#8F897C;
  --serif:'Instrument Serif',Georgia,serif; --data:'Martian Mono',ui-monospace,monospace; }
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;overflow:hidden;width:100vw;height:100vh;
  font:14px/1.5 "Instrument Sans",system-ui,-apple-system,sans-serif;color:var(--ink)}
#fig{position:fixed;top:0;left:0;width:120px;height:245px;pointer-events:none;z-index:2;
     transition:transform 5s cubic-bezier(.45,.05,.55,.95);will-change:transform;
     filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
#fig.instant{transition:none}
#fig.sitfall{transition:transform .45s cubic-bezier(.34,1.4,.64,1)}
#fig svg{overflow:visible}
#fig line,#fig circle{stroke:var(--ink);stroke-width:5;stroke-linecap:round;fill:none}
#fig .outline line,#fig .outline circle{stroke:#fff;stroke-width:9}
#fig .face circle{stroke:none;fill:var(--ink)}
#fig .face path{stroke-width:2.4;stroke:var(--ink);fill:none}
.limb{transform-box:view-box;transition:transform .4s}
#skin{position:absolute;inset:0;display:none;transform-origin:50% 100%;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
#fig.skin #skin{display:block}
#fig.skin svg{display:none}
.sk{position:absolute}
#skStand{left:15px;top:0;height:245px}
#skWalk{left:60px;top:0;height:245px;display:none;transform:translateX(-50%) scaleX(-1)}
#skSit{left:11px;top:-4px;height:210px;display:none}
.walking #skStand{display:none}
.walking #skWalk{display:block}
.seated #skStand,.seated #skWalk{display:none}
.seated #skSit{display:block}
#mouth{left:60px;top:-6px;height:58px;transform:translateX(-50%);display:none}
.seated.talking #mouth{display:block}
#pose{left:60px;top:0;height:245px;transform:translateX(-50%);display:none}
.posing #skStand,.posing #skWalk,.posing #skSit,.posing #mouth{display:none!important}
.posing #pose{display:block}
.walking #skin{animation:pWalk .42s ease-in-out infinite}
@keyframes pWalk{0%,100%{transform:translateY(0) rotate(1.5deg)}50%{transform:translateY(-6px) rotate(-1.2deg)}}
.walking .legL{animation:legA .55s ease-in-out infinite}
.walking .legR{animation:legB .55s ease-in-out infinite}
.walking .armL{animation:legB .55s ease-in-out infinite}
.walking .armR{animation:legA .55s ease-in-out infinite}
.walking .body{animation:bob .275s ease-in-out infinite}
@keyframes legA{0%,100%{transform:rotate(26deg)}50%{transform:rotate(-24deg)}}
@keyframes legB{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(26deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.seated .legL{transform:rotate(-70deg)}
.seated .legR{transform:rotate(-94deg)}
.seated .shinL{transform:rotate(74deg)}
.seated .shinR{transform:rotate(96deg)}
.seated .armL{transform:rotate(-18deg)}
.seated .armR{transform:rotate(-38deg)}
.waving .armR{animation:wave .5s ease-in-out 2}
@keyframes wave{0%,100%{transform:rotate(-38deg)}50%{transform:rotate(-165deg)}}
#door{position:fixed;width:120px;height:212px;perspective:700px;opacity:0;
  transition:opacity 3s ease;pointer-events:none;z-index:1}
#door.show{opacity:1}
#door.bye{transition-duration:.7s}
#door .framebox{position:absolute;inset:-7px;border:7px solid var(--card);
  border-radius:10px 10px 0 0;border-bottom:none;box-shadow:0 14px 44px rgba(6,7,10,.45)}
#door .opening{position:absolute;inset:0;background:#000;overflow:hidden}
#door .opening canvas{width:100%;height:100%;display:block}
#door .panel{position:absolute;inset:0;background:var(--paper2);border:2px solid var(--line);
  transform-origin:left center;transition:transform .8s cubic-bezier(.6,.05,.3,1)}
#door.open .panel{transform:rotateY(-80deg)}
#door .knob{position:absolute;right:11px;top:99px;width:9px;height:9px;border-radius:50%;background:var(--soft3)}
#bubble{position:fixed;z-index:1;width:min(430px,44vw);background:var(--card);
  border:1px solid var(--line);border-radius:16px;padding:14px 16px;
  max-height:min(46vh,440px);overflow-y:auto;overscroll-behavior:contain;
  box-shadow:0 14px 40px rgba(6,7,10,.35);opacity:0;transform:translateY(10px);
  transition:opacity .4s,transform .4s}
#bubble.show{opacity:1;transform:none}
#bubble::before{content:"";position:absolute;left:-8px;bottom:26px;width:15px;height:15px;
  background:var(--card);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.blede{font-family:var(--serif);font-size:20px;line-height:1.25;margin-bottom:6px;padding-right:18px}
.btext{font-size:13px;color:var(--soft);white-space:pre-wrap}
.brec{display:none;font:10.5px/1.6 var(--data);color:var(--soft3);margin-top:9px;border-top:1px solid var(--line);padding-top:7px}
.btext del{color:var(--del)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font:12px/1 inherit;font-size:12px;background:var(--paper2);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip:hover{border-color:var(--blue)}
.bye{position:sticky;float:right;top:0;margin:-4px -6px 0 8px;border:0;background:none;color:#999;cursor:pointer;font-size:14px}
.cursor{display:inline-block;width:7px;height:14px;background:var(--blue);vertical-align:-2px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style>
</head>

function setPose(n){ document.getElementById("pose").src = POSES[n]; fig.classList.add("posing"); }
function clearPose(){ fig.classList.remove("posing"); }
function danceMoves(){
  fig.classList.remove("seated","sitfall");
  fig.style.transitionDuration = "400ms";
  place(mid);
  var seq = ["dancePeace","danceSpin","danceStar","danceKick","danceLean","danceHandstand","danceStar","danceKick"];
  var i = 0; setPose(seq[0]);
  var t = setInterval(function(){
    i++;
    if(i >= seq.length){
      clearInterval(t); clearPose();
      fig.classList.add("sitfall","seated");
      place(sit);
      setTimeout(function(){ fig.style.transitionDuration = ""; }, 500);
      return;
    }
    setPose(seq[i]);
  }, 430);

  var seq = [1,2,0,2,1,3,2,0];
  var i = 0;
  m.src = MOUTHS[1];
  mouthTimer = setInterval(function(){
    i++;
    m.src = MOUTHS[seq[i % seq.length]];
  }, 115);
}
function stopMouth(){
  if(mouthTimer){clearInterval(mouthTimer); mouthTimer = null;}
  fig.classList.remove("talking");
}
var typing=null;
function speak(lede, text, receipt, done){
  document.getElementById("blede").textContent = lede;
  var bt = document.getElementById("btext"), br = document.getElementById("brec");
  br.style.display="none"; br.textContent="";
  if(typing){clearInterval(typing);typing=null}
  var plain = text.replace(/~~(.+?)~~/g,"$1");
  bt.innerHTML = '<span id="tw"></span><span class="cursor"></span>';
  var tw = document.getElementById("tw"), i = 0;
  startMouth();
  typing = setInterval(function(){
    i += 2; tw.textContent = plain.slice(0,i);
    bubble.scrollTop = bubble.scrollHeight;
    if(i >= plain.length){
      clearInterval(typing); typing=null;
      stopMouth();
      bt.innerHTML = text.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]}).replace(/~~(.+?)~~/g,"<del>$1</del>");
      if(receipt){ br.textContent = receipt; br.style.display="block"; }
      if(done) done();
    }
    reportRects();
  },16);
}
function askBilly(q){
  if(/off the record|\bdance\b/i.test(q)){
    danceMoves();
    speak("A dance, per request.", "The corpus has no section on rhythm, so what you are watching is uncorroborated motion. The grounding stage let it through because nobody claimed it was good.", null);
    return;
  }
  speak("Good question.", "Let me run that through the machinery…", null);
  bridgeAsk(q)
  .then(function(s){
    if(s&&s.lede) speak(s.lede, s.rest, s.receipt||null);
    else speak("Hm.","The pipeline returned nothing I can say.",null); })
  .catch(function(e){ speak("Hm.","The pipeline errored ("+e.message+").",null); });
}
CHIPS.forEach(function(c){
  var b=document.createElement("button"); b.className="chip"; b.textContent=c;
  b.onclick=function(){askBilly(c)};
  document.getElementById("chips").appendChild(b);
});
document.getElementById("bye").onclick=function(){ bridgeQuit(); };

/* choreography: a door materializes on the desktop, rains, opens, he steps out */
var door = document.getElementById("door");
door.style.left = doorX + "px";
door.style.top = (doorBottom - doorH) + "px";
place(start);
fig.style.opacity = 0;
fig.getBoundingClientRect();
door.classList.add("show");
startRain();
setTimeout(function(){ door.classList.add("open"); }, 3100);
setTimeout(function(){ fig.style.transition = "opacity .3s"; fig.style.opacity = 1; }, 3650);
setTimeout(function(){
  fig.style.transition = "";
  fig.classList.remove("instant");
  fig.classList.add("walking");
  startWalkCycle();
  fig.style.transitionDuration = "2800ms";
  fig.getBoundingClientRect();
  setTimeout(function(){ place(mid); }, 30);
  setTimeout(function(){ door.classList.remove("open"); }, 1000);
  setTimeout(function(){ door.classList.add("bye"); door.classList.remove("show"); }, 2000);
  setTimeout(stopRain, 2900);
}, 4100);
fig.addEventListener("transitionend", function step(ev){
  if(ev.propertyName !== "transform") return;
  fig.removeEventListener("transitionend", step);
  fig.classList.remove("walking");
  stopWalkCycle();
  fig.style.transitionDuration="";
  setPose("pointFront");
  setTimeout(function(){
    clearPose();
    fig.classList.add("sitfall","seated");
    place(sit);
  }, 1200);
  closeDoor();
  setTimeout(function(){
    fig.classList.add("waving");
    setTimeout(function(){fig.classList.remove("waving")},1100);
    bubble.classList.add("show");
    positionBubble();
    speak(GREET_LEDE, GREET, null);
  }, 550);
});
window.addEventListener("resize", positionBubble);

/* a second summon retires this instance with dignity */
window.__retire = function(){
  if(window.__retiring) return; window.__retiring = true;
  fig.classList.remove("seated","sitfall");
  bubble.classList.add("show"); positionBubble();
  speak("A fresh me is incoming.",
        "Two of me is a governance problem, so I will show myself out. He has the same corpus and better posture. Good luck in there.", null);
  setTimeout(function(){
    bubble.classList.remove("show");
    fig.classList.add("walking");
    startWalkCycle();
    fig.style.transitionDuration = "2200ms";
    fig.getBoundingClientRect();
    setTimeout(function(){ place({x: SW + 160, y: mid.y, s: 1}); }, 30);
  }, 2800);
  setTimeout(function(){ bridgeQuit(); }, 5400);
};

/* answers pushed from the chat: spoken as soon as he is seated */
var seatedReady = false, speakQueue = [];
function handlePush(pl){
  if(!pl || !pl.lede) return;
  if(!seatedReady){ speakQueue.push(pl); return; }
  bubble.classList.add("show"); positionBubble();
  speak(pl.lede, pl.rest||"", pl.receipt||null);
}
if(window.overlay && window.overlay.onSpeak) window.overlay.onSpeak(handlePush);
(function watchSeated(){
  var t = setInterval(function(){
    if(fig.classList.contains("seated") && bubble.classList.contains("show")){
      seatedReady = true; clearInterval(t);
      if(speakQueue.length){ var last = speakQueue.pop(); speakQueue = []; setTimeout(function(){ handlePush(last); }, 1200); }
    }
  }, 300);
})();
})();
</script>
