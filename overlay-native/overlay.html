:root{ --blue:#2B47FF; --lime:#CBFF4D; --ink:#0C0B08; --card:#F4F3EE; --paper2:#E9E7DF;
  --line:#DBD7CB; --del:#FF4A38; --soft:#57534A; --soft3:#8F897C;
  --serif:'Instrument Serif',Georgia,serif; --data:'Martian Mono',ui-monospace,monospace; }
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;overflow:hidden;width:100vw;height:100vh;
  font:14px/1.5 "Instrument Sans",system-ui,-apple-system,sans-serif;color:var(--ink)}
#fig{position:fixed;top:0;left:0;width:120px;height:245px;pointer-events:none;z-index:2;
     transition:transform 5s cubic-bezier(.45,.05,.55,.95);will-change:transform;
     filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
#fig.instant{transition:none}
#fig.sitfall{transition:transform .45s cubic-bezier(.34,1.4,.64,1)}
#fig svg{overflow:visible}
#fig line,#fig circle{stroke:var(--ink);stroke-width:5;stroke-linecap:round;fill:none}
#fig .outline line,#fig .outline circle{stroke:#fff;stroke-width:9}
#fig .face circle{stroke:none;fill:var(--ink)}
#fig .face path{stroke-width:2.4;stroke:var(--ink);fill:none}
.limb{transform-box:view-box;transition:transform .4s}
#skin{position:absolute;inset:0;display:none;transform-origin:50% 100%;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
#fig.skin #skin{display:block}
#fig.skin svg{display:none}
.sk{position:absolute}
#skStand{left:15px;top:0;height:245px}
#skWalk{left:60px;top:-3px;height:250px;display:none;transform:translateX(-50%) scaleX(-1)}
#skSit{left:11px;top:-4px;height:210px;display:none}
.walking #skStand{display:none}
#puppet{position:absolute;left:60px;top:-3px;width:126px;height:245px;display:none;transform:translateX(-50%) scaleX(-1)}
#puppet img{position:absolute}
#pBody{left:17.5px;top:0;height:137px;z-index:2}
.pleg{position:absolute;top:134px;width:97px;height:111px}
#plF{left:31px;transform-origin:33.5px 1px;z-index:1}
#plB{left:0;transform-origin:64.5px 1px}
.pthigh{top:0;height:54px}
#plF .pthigh{left:0}
#plB .pthigh{left:17px}
.pshin{position:absolute;top:51px;width:97px;height:60px}
#plF .pshin{left:15.5px;transform-origin:35px 2px}
#plB .pshin{left:0;transform-origin:44px 2px}
.pshin img{position:absolute;left:0;top:0;height:60px}
.walking #puppet{display:block}
.faceR #puppet{transform:translateX(-50%) scaleX(1)}
.walking #plF{animation:thF .44s ease-in-out infinite alternate}
.walking #plB{animation:thB .44s ease-in-out infinite alternate}
.walking #plF .pshin{animation:shF .44s ease-in-out infinite alternate}
.walking #plB .pshin{animation:shB .44s ease-in-out infinite alternate}
.walking #pBody{animation:swayB .88s ease-in-out infinite;transform-origin:47px 135px}
@keyframes thF{from{transform:rotate(-14deg)}to{transform:rotate(8deg)}}
@keyframes thB{from{transform:rotate(14deg)}to{transform:rotate(-8deg)}}
@keyframes shF{from{transform:rotate(2deg)}to{transform:rotate(24deg)}}
@keyframes shB{from{transform:rotate(24deg)}to{transform:rotate(2deg)}}
@keyframes swayB{0%,100%{transform:rotate(1deg)}50%{transform:rotate(-1deg)}}
.seated #skStand,.seated #skWalk{display:none}
.seated #skSit{display:block}
#pose{left:60px;top:0;height:245px;transform:translateX(-50%);display:none}
.mirrorL #pose{transform:translateX(-50%) scaleX(-1)}
#wand{position:absolute;left:96px;top:86px;width:74px;height:4px;border-radius:2px;display:none;
  background:linear-gradient(90deg,rgba(255,255,255,.15),#fff);transform-origin:0 50%;
  transform:rotate(-14deg) scaleX(0);filter:drop-shadow(0 0 6px rgba(255,255,255,.8))}
#wand::after{content:"";position:absolute;right:-9px;top:-7px;width:18px;height:18px;
  background:radial-gradient(circle,#fff 0 22%,rgba(255,255,255,.65) 34%,transparent 62%);
  animation:wandStar 1s ease-in-out infinite}
@keyframes wandStar{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.55);opacity:1}}
.wandOut #wand{display:block;animation:wandDraw .38s cubic-bezier(.2,1.5,.5,1) forwards}
@keyframes wandDraw{from{transform:rotate(-120deg) scaleX(.1)}to{transform:rotate(-14deg) scaleX(1)}}
.mirrorL #wand{left:auto;right:96px;transform-origin:100% 50%}
.mirrorL.wandOut #wand{animation:wandDrawL .38s cubic-bezier(.2,1.5,.5,1) forwards}
@keyframes wandDrawL{from{transform:rotate(120deg) scaleX(-.1)}to{transform:rotate(14deg) scaleX(-1)}}
#beams{position:fixed;inset:0;pointer-events:none;z-index:1}
.spotx{position:fixed;display:block;border-radius:10px;pointer-events:none;z-index:1;
  box-shadow:0 0 0 3px rgba(255,255,255,.95),0 0 30px 6px rgba(255,255,255,.45),inset 0 0 40px rgba(255,255,255,.12);
  animation:spotPulse 1.2s ease-in-out infinite}
#spot{position:fixed;display:none;border-radius:10px;pointer-events:none;z-index:1;
  box-shadow:0 0 0 3px rgba(255,255,255,.95),0 0 30px 6px rgba(255,255,255,.45),inset 0 0 40px rgba(255,255,255,.12);
  animation:spotPulse 1.2s ease-in-out infinite}
#spot.on{display:block}
@keyframes spotPulse{0%,100%{box-shadow:0 0 0 3px rgba(255,255,255,.95),0 0 30px 6px rgba(255,255,255,.45),inset 0 0 40px rgba(255,255,255,.12)}
  50%{box-shadow:0 0 0 5px rgba(255,255,255,1),0 0 48px 12px rgba(255,255,255,.6),inset 0 0 60px rgba(255,255,255,.2)}}
.posing #skStand,.posing #skWalk,.posing #skSit{display:none!important}
.posing #pose{display:block}
.walking #skin{animation:pWalk .78s ease-in-out infinite}
@keyframes pWalk{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.walking .legL{animation:legA .55s ease-in-out infinite}
.walking .legR{animation:legB .55s ease-in-out infinite}
.walking .armL{animation:legB .55s ease-in-out infinite}
.walking .armR{animation:legA .55s ease-in-out infinite}
.walking .body{animation:bob .275s ease-in-out infinite}
@keyframes legA{0%,100%{transform:rotate(26deg)}50%{transform:rotate(-24deg)}}
@keyframes legB{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(26deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.seated .legL{transform:rotate(-70deg)}
.seated .legR{transform:rotate(-94deg)}
.seated .shinL{transform:rotate(74deg)}
.seated .shinR{transform:rotate(96deg)}
.seated .armL{transform:rotate(-18deg)}
.seated .armR{transform:rotate(-38deg)}
.waving .armR{animation:wave .5s ease-in-out 2}
@keyframes wave{0%,100%{transform:rotate(-38deg)}50%{transform:rotate(-165deg)}}
#door{position:fixed;width:120px;height:212px;perspective:700px;opacity:0;
  transition:opacity 3s ease;pointer-events:none;z-index:1}
#door.show{opacity:1}
#door.bye{transition-duration:.7s}
#door .framebox{position:absolute;inset:-7px;border:7px solid var(--card);
  border-radius:10px 10px 0 0;border-bottom:none;box-shadow:0 14px 44px rgba(6,7,10,.45)}
#door .opening{position:absolute;inset:0;background:#000;overflow:hidden}
#door .opening canvas{width:100%;height:100%;display:block}
#door .panel{position:absolute;inset:0;background:var(--paper2);border:2px solid var(--line);
  transform-origin:left center;transition:transform .8s cubic-bezier(.6,.05,.3,1)}
#door.open .panel{transform:rotateY(-80deg)}
#door .knob{position:absolute;right:11px;top:99px;width:9px;height:9px;border-radius:50%;background:var(--soft3)}
#ledge{position:fixed;height:11px;width:172px;background:var(--paper2);
  border:2px solid var(--ink);border-radius:7px;
  box-shadow:0 7px 18px rgba(6,7,10,.28);opacity:0;transition:opacity .35s;
  z-index:1;pointer-events:none}
#ledge.on{opacity:1}
#bubble{position:fixed;z-index:1;width:min(430px,44vw);background:var(--card);
  border:1px solid var(--line);border-radius:16px;padding:14px 16px;
  max-height:min(46vh,440px);overflow-y:auto;overscroll-behavior:contain;
  box-shadow:0 14px 40px rgba(6,7,10,.35);opacity:0;transform:translateY(10px);
  transition:opacity .4s,transform .4s}
#bubble.show{opacity:1;transform:none}
#bubble::before{content:"";position:absolute;left:-8px;bottom:26px;width:15px;height:15px;
  background:var(--card);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.blede{font-family:var(--serif);font-size:20px;line-height:1.25;margin-bottom:6px;padding-right:18px}
.btext{font-size:13px;color:var(--soft);white-space:pre-wrap}
.brec{display:none;font:10.5px/1.6 var(--data);color:var(--soft3);margin-top:9px;border-top:1px solid var(--line);padding-top:7px}
.btext del{color:var(--del)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.bask{display:flex;gap:6px;margin-top:10px}
.bask input{flex:1;min-width:0;background:rgba(0,0,0,.05);border:1px solid rgba(0,0,0,.25);
  border-radius:8px;padding:7px 10px;font:12px 'Martian Mono',monospace;color:inherit;outline:none}
.bask input:focus{border-color:rgba(0,0,0,.7);background:#fff}
.bask button{border:1px solid rgba(0,0,0,.7);background:#111;color:#fff;border-radius:8px;
  padding:7px 12px;font:11px 'Martian Mono',monospace;cursor:pointer}
.bask button:active{transform:translateY(1px)}
.chip{font:12px/1 inherit;font-size:12px;background:var(--paper2);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip:hover{border-color:var(--blue)}
.bye{position:sticky;float:right;top:0;margin:-4px -6px 0 8px;border:0;background:none;color:#999;cursor:pointer;font-size:14px}
.cursor{display:inline-block;width:7px;height:14px;background:var(--blue);vertical-align:-2px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style>
</head>

  }, 430);

  if(typing){clearInterval(typing);typing=null}
  var plain = text.replace(/~~(.+?)~~/g,"$1");
  bt.innerHTML = '<span id="tw"></span><span class="cursor"></span>';
  var tw = document.getElementById("tw"), i = 0;
  typing = setInterval(function(){
    i += 2; tw.textContent = plain.slice(0,i);
    bubble.scrollTop = bubble.scrollHeight;
    if(i >= plain.length){
      clearInterval(typing); typing=null;
      bt.innerHTML = text.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]}).replace(/~~(.+?)~~/g,"<del>$1</del>");
      if(receipt){ br.textContent = receipt; br.style.display="block"; }
      if(done) done();
    }
    reportRects();
  },16);
}
function heardPost(q){
  if(!(NATIVE && BRAIN)) return;
  fetch("http://127.0.0.1:" + BRAIN + "/heard", {method:"POST",
    headers:{"content-type":"application/json","x-stage-token": CFG.token || ""},
    body: JSON.stringify({text: q})}).catch(function(){});
}
function askActor(q){
  heardPost(q);
  if(/off the record|\bdance\b/i.test(q)){
    danceMoves();
    speak("A dance, per request.", "The corpus has no section on rhythm, so what you are watching is uncorroborated motion. The grounding stage let it through because nobody claimed it was good.", null);
    return;
  }
  speak("Good question.", "Let me run that through the machinery…", null);
  bridgeAsk(q)
  .then(function(s){
    if(s&&s.lede) speak(s.lede, s.rest, s.receipt||null);
    else speak("Hm.","The pipeline returned nothing I can say.",null); })
  .catch(function(e){ speak("I've lost contact with my brain.",
    "The pipeline that fact-checks me is not answering ("+e.message+"), which means right now I am legally just a drawing. Anything I said would be unsourced, and you know how I feel about that. Summon me again, or check that the MCP server is still alive.", null); });
}
(function(){
  var bq = document.getElementById("bq"), bgo = document.getElementById("bgo");
  function go(){
    var q = (bq.value || "").trim();
    if(!q) return;
    bq.value = "";
    askActor(q);
  }
  bgo.onclick = go;
  bq.addEventListener("keydown", function(ev){ if(ev.key === "Enter") go(); });
})();
CHIPS.forEach(function(c){
  var b=document.createElement("button"); b.className="chip"; b.textContent=c;
  b.onclick=function(){askActor(c)};
  document.getElementById("chips").appendChild(b);
});
function goHome(){
  if(window.__going){ bridgeQuit(); return; }
  window.__going = true;
  var url = "http://127.0.0.1:" + BRAIN + "/stage-page?t=" + (CFG.token || "");
  bubble.classList.add("show"); positionBubble();
  speak("Follow me.", "I keep my receipts on the page. Opening it now, meet me there.", null);
  if(NATIVE && window.webkit.messageHandlers.openstage){ webkit.messageHandlers.openstage.postMessage(url); }
  else if(NATIVE){ webkit.messageHandlers.openurl.postMessage(url); }
  var es = new EventSource("http://127.0.0.1:" + BRAIN + "/stage-events?t=" + (CFG.token || ""));
  var done = false;
  es.onmessage = function(ev){
    var m = {}; try{ m = JSON.parse(ev.data); }catch(e){ return; }
    if(m.type === "door-ready" && !done){ done = true; es.close(); walkTo(m.x, m.y); }
  };
  setTimeout(function(){ if(!done){ es.close(); bridgeQuit(); } }, 10000);
}
function walkTo(sx, sy){
  ledge.classList.remove("on");
  bubble.classList.remove("show");
  fig.classList.remove("seated","sitfall");
  var tx = sx - 63, ty = sy - 245;
  if(tx > lastP.x) fig.classList.add("faceR");
  fig.classList.add("walking");
  startWalkCycle();
  fig.style.transitionDuration = "2600ms";
  fig.getBoundingClientRect();
  setTimeout(function(){ place({x: tx, y: ty, s: 1}); }, 30);
  fig.addEventListener("transitionend", function cross(ev){
    if(ev.propertyName !== "transform") return;
    fig.removeEventListener("transitionend", cross);
    fig.classList.remove("walking");
    fetch("http://127.0.0.1:" + BRAIN + "/stage", {method:"POST",
      headers:{"content-type":"application/json","x-stage-token": CFG.token || ""},
      body: JSON.stringify({type:"crossing"})}).catch(function(){});
    fig.style.transition = "opacity .5s";
    fig.style.opacity = 0;
    setTimeout(function(){ bridgeQuit(); }, 1000);
  });
}
window.__gohome = goHome;
document.getElementById("bye").onclick=function(){
  if(NATIVE && BRAIN){ goHome(); } else { bridgeQuit(); }
};

/* choreography: a door materializes on the desktop, rains, opens, he steps out */
var door = document.getElementById("door");
door.style.left = doorX + "px";
door.style.top = (doorBottom - doorH) + "px";
place(start);
fig.style.opacity = 0;
fig.getBoundingClientRect();
door.classList.add("show");
startRain();
setTimeout(function(){ door.classList.add("open"); }, 3100);
setTimeout(function(){ fig.style.transition = "opacity .3s"; fig.style.opacity = 1; }, 3650);
setTimeout(function(){
  fig.style.transition = "";
  fig.classList.remove("instant");
  fig.classList.add("walking");
  startWalkCycle();
  fig.style.transitionDuration = "2800ms";
  fig.getBoundingClientRect();
  setTimeout(function(){ place(mid); }, 30);
  setTimeout(stopRain, 2900);
}, 4100);
function closeDoor(){
  door.classList.remove("open");
  setTimeout(function(){ door.classList.add("bye"); door.classList.remove("show"); }, 900);
  if (typeof stopRain === "function") setTimeout(stopRain, 1800);
}
fig.addEventListener("transitionend", function step(ev){
  if(ev.propertyName !== "transform") return;
  fig.removeEventListener("transitionend", step);
  fig.classList.remove("walking");
  stopWalkCycle();
  fig.style.transitionDuration="";
  placeLedge();
  ledge.classList.add("on");
  fig.classList.add("sitfall","seated");
  place(sit);
  closeDoor();
  setTimeout(function(){
    fig.classList.add("waving");
    setTimeout(function(){fig.classList.remove("waving")},1100);
    bubble.classList.add("show");
    positionBubble();
    speak(GREET_LEDE, GREET, null);
  }, 550);
});
Array.prototype.forEach.call(document.querySelectorAll("#skin img"), function(img){
  img.addEventListener("error", function once(){
    img.removeEventListener("error", once);
    if(!img.getAttribute("src")) return;
    if(!fig.classList.contains("skin")) return;
    fig.classList.remove("skin","posing");
    document.getElementById("blede").textContent = "I appear to have lost my body.";
    document.getElementById("btext").textContent = "A sprite failed to load, so the stick figure is stepping in. He is load-bearing and has no ego about it.";
    bubble.classList.add("show"); positionBubble();
  });
});
window.addEventListener("resize", positionBubble);

/* the Claude window moved, appeared, or resized: glide to the new seat */
window.__reseat = function(c){
  if(!c || window.__retiring || window.__verbMode) return;
  CLAUDE = c;
  seat = { x: CLAUDE.x + Math.round(CLAUDE.w*0.42), hipY: CLAUDE.y + CLAUDE.h - 150 };
  mid = { x: seat.x, y: seat.hipY - 149, s: 1 };
  sit = { x: seat.x, y: seat.hipY - 113, s: 1 };
  if(fig.classList.contains("seated")){
    fig.style.transitionDuration = "600ms";
    place(sit);
    placeLedge();
    setTimeout(function(){ fig.style.transitionDuration = ""; positionBubble(); }, 650);
  }
};

/* a second summon retires this instance with dignity */
window.__retire = function(){
  if(window.__retiring) return; window.__retiring = true;
  fig.classList.remove("seated","sitfall");
  ledge.classList.remove("on");
  bubble.classList.add("show"); positionBubble();
  speak("A fresh me is incoming.",
        "Two of me is a governance problem, so I will show myself out. He has the same corpus and better posture. Good luck in there.", null);
  setTimeout(function(){
    bubble.classList.remove("show");
    fig.classList.add("walking");
    startWalkCycle();
    fig.style.transitionDuration = "2200ms";
    fig.getBoundingClientRect();
    setTimeout(function(){ place({x: SW + 160, y: mid.y, s: 1}); }, 30);
  }, 2800);
  setTimeout(function(){ bridgeQuit(); }, 5400);
};

/* ---- Desk Tour verbs: stage directions pushed from the MCP server.
   The actor walks and points and sits; he never clicks. ---- */
function positionBubbleAt(x, y){
  var bx = x + 130, by = y - 40;
  if(bx + bubble.offsetWidth > SW - 20) bx = Math.max(20, x - bubble.offsetWidth - 24);
  bubble.style.left = bx + "px"; bubble.style.top = Math.max(20, by) + "px";
  reportRects();
}
var beamCv = document.getElementById("beams"), beams = [], beamRaf = null;
function fireBeam(x0, y0, x1, y1, hit){
  if(!beams.length){
    var dpr = window.devicePixelRatio || 1;
    beamCv.width = innerWidth * dpr; beamCv.height = innerHeight * dpr;
    beamCv.getContext("2d").scale(dpr, dpr);
  }
  beams.push({x0:x0, y0:y0, x1:x1, y1:y1, t0:performance.now(), dur:150, fade:500, hit:hit, landed:false});
  if(!beamRaf) beamTick();
}
function beamTick(){
  beamRaf = requestAnimationFrame(beamTick);
  var ctx = beamCv.getContext("2d");
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  var now = performance.now(), alive = false;
  for(var i = 0; i < beams.length; i++){
    var b = beams[i];
    var p = Math.min(1, (now - b.t0) / b.dur);
    var a = p < 1 ? 1 : Math.max(0, 1 - (now - b.t0 - b.dur) / b.fade);
    if(a <= 0) continue;
    alive = true;
    if(p >= 1 && !b.landed){ b.landed = true; if(b.hit) b.hit(); }
    var ex = b.x0 + (b.x1 - b.x0) * p, ey = b.y0 + (b.y1 - b.y0) * p;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.strokeStyle = "#fff"; ctx.lineCap = "round";
    ctx.shadowColor = "rgba(255,255,255,.9)"; ctx.shadowBlur = 16;
    ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(b.x0, b.y0); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.shadowBlur = 0; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(b.x0, b.y0); ctx.lineTo(ex, ey); ctx.stroke();
    if(p >= 1){
      ctx.beginPath(); ctx.arc(b.x1, b.y1, 7 + 5 * a, 0, 7);
      ctx.fillStyle = "rgba(255,255,255," + (0.5 * a).toFixed(2) + ")"; ctx.fill();
    }
    ctx.restore();
  }
  if(!alive){
    cancelAnimationFrame(beamRaf); beamRaf = null; beams = [];
    ctx.clearRect(0, 0, innerWidth, innerHeight);
  }
}
function addSpot(r){
  var d = document.createElement("div");
  d.className = "spotx";
  d.style.left = r.x + "px"; d.style.top = r.y + "px";
  d.style.width = r.w + "px"; d.style.height = r.h + "px";
  document.body.appendChild(d);
}
function clearSpots(){
  Array.prototype.forEach.call(document.querySelectorAll(".spotx"), function(e){ e.remove(); });
}
var spot = document.getElementById("spot");
function spotShow(r){ spot.style.left=r.x+"px"; spot.style.top=r.y+"px"; spot.style.width=r.w+"px"; spot.style.height=r.h+"px"; spot.classList.add("on"); }
function spotMove(x,y){ spot.style.left=x+"px"; spot.style.top=y+"px"; }
function spotHide(){ spot.classList.remove("on"); }
function wandOut(){ fig.classList.add("wandOut"); }
function wandAway(){ fig.classList.remove("wandOut"); }
function walkFig(tx, ty, cb){
  window.__verbMode = true;
  ledge.classList.remove("on");
  bubble.classList.remove("show");
  clearPose();
  wandAway(); spotHide(); clearSpots();
  fig.classList.remove("seated","sitfall","mirrorL");
  if(tx > lastP.x) fig.classList.add("faceR"); else fig.classList.remove("faceR");
  var dist = Math.hypot(tx - lastP.x, ty - lastP.y);
  if(dist < 6){ place({x: tx, y: ty, s: 1}); if(cb) setTimeout(cb, 60); return; }
  var ms = Math.max(800, Math.min(3400, Math.round(dist * 2.2)));
  fig.classList.add("walking");
  fig.style.transitionDuration = ms + "ms";
  fig.getBoundingClientRect();
  setTimeout(function(){ place({x: tx, y: ty, s: 1}); }, 30);
  var fired = false;
  function finish(){
    if(fired) return; fired = true;
    fig.removeEventListener("transitionend", done);
    fig.classList.remove("walking");
    fig.style.transitionDuration = "";
    if(cb) cb();
  }
  function done(ev){ if(ev.propertyName !== "transform") return; finish(); }
  fig.addEventListener("transitionend", done);
  setTimeout(finish, ms + 500); /* transitionend can be swallowed; the walk must not stall */
}
function verbSay(m, defLede, x, y){
  if(!m.say) return;
  bubble.classList.add("show");
  positionBubbleAt(x, y);
  speak(m.lede || defLede, m.say, m.receipt || null);
}
function verbPoint(m){
  var t = m.target; if(!t) return;
  var footY = Math.max(t.y, 300);
  var leftX = t.x - 150;
  var standX = leftX > 10 ? leftX : Math.min(t.x + t.w + 24, SW - 150);
  var ty = footY - 245;
  walkFig(standX, ty, function(){
    var toward = (t.x + t.w/2) > (standX + 63);
    if(!toward) fig.classList.add("mirrorL");
    setPose("pointSide");
    wandOut();
    setTimeout(function(){ spotShow(t); }, 380);
    verbSay(m, "That one. Right there.", standX, ty);
  });
}
function verbSit(m){
  var t = m.target; if(!t) return;
  var edgeY = Math.max(t.y, 160);
  var sx = t.x + Math.round(t.w * 0.5) - 63;
  sx = Math.max(10, Math.min(sx, SW - 150));
  walkFig(sx, edgeY - 245, function(){
    fig.classList.add("sitfall","seated");
    place({x: sx, y: edgeY - 113, s: 1});
    setTimeout(function(){ verbSay(m, "Good ledge. Sturdy title bar.", sx, edgeY - 113); }, 500);
  });
}
function verbLasers(m){
  var ts = m.targets || [];
  if(!ts.length) return;
  var standX = Math.round(SW * 0.45) - 63;
  var footY = SH - 90;
  walkFig(standX, footY - 245, function(){
    setPose("pointUp");
    var tip = { x: standX + 78, y: footY - 245 + 6 };
    var i = 0;
    (function next(){
      if(i >= ts.length){
        setTimeout(function(){
          bubble.classList.add("show");
          positionBubbleAt(standX, footY - 245);
          speak(m.lede || "The whole stage, lit.",
                m.say || "Every window up there just took a direct hit of pure light. Not one of them received an event. That is the entire trick: I can show you everything and touch nothing.",
                null);
        }, 400);
        setTimeout(function(){ clearSpots(); clearPose(); }, 6000);
        return;
      }
      var t2 = ts[i++];
      fireBeam(tip.x, tip.y, t2.x + t2.w / 2, t2.y + t2.h / 2, function(){ addSpot(t2); });
      setTimeout(next, 380);
    })();
  });
}
var pendingMoveSay = null;
function verbMove(m){
  var t = m.target; if(!t) return;
  var footY = Math.max(t.y, 300);
  var leftX = t.x - 150;
  var standX = leftX > 10 ? leftX : Math.min(t.x + t.w + 24, SW - 150);
  var ty = footY - 245;
  pendingMoveSay = { m: m, x: standX, y: ty };
  walkFig(standX, ty, function(){
    var toward = (t.x + t.w/2) > (standX + 63);
    if(!toward) fig.classList.add("mirrorL");
    setPose("pointSide");
    wandOut();
    setTimeout(function(){ spotShow(t); }, 380);
    setTimeout(function(){
      if(NATIVE && window.webkit.messageHandlers.movewin){
        webkit.messageHandlers.movewin.postMessage({pid: t.pid, cur:{x:t.x,y:t.y,w:t.w,h:t.h}, to:{x:m.to.x,y:m.to.y}, ms: 1100});
      }
    }, 1100);
  });
}
window.__winstep = function(x,y){ spotMove(x,y); };
window.__windone = function(x,y){
  spotMove(x,y);
  var p = pendingMoveSay; pendingMoveSay = null;
  setTimeout(spotHide, 1400);
  if(p && p.m.say){ bubble.classList.add("show"); positionBubbleAt(p.x, p.y); speak(p.m.lede || "Rearranged.", p.m.say, p.m.receipt || null); }
};
window.__moveDenied = function(why){
  wandAway(); spotHide();
  var p = pendingMoveSay; pendingMoveSay = null;
  bubble.classList.add("show");
  if(p) positionBubbleAt(p.x, p.y); else positionBubble();
  if(why === "lost"){
    speak("The window slipped away.", "I found the app but not that exact window anymore. It may have moved or closed. Survey the stage again and re-aim me.", null);
  } else {
    speak("The OS says I can't touch the furniture.", "Moving a window needs Accessibility permission. System Settings, Privacy and Security, Accessibility, then add the overlay runtime. Until then I point, I sit, I talk. I still never click.", null);
  }
};
if(NATIVE && BRAIN){
  var verbES = new EventSource("http://127.0.0.1:" + BRAIN + "/stage-events?t=" + (CFG.token || ""));
  verbES.onmessage = function(ev){
    var m = {}; try{ m = JSON.parse(ev.data); }catch(e){ return; }
    if(m.type !== "verb.point" && m.type !== "verb.sit" && m.type !== "verb.move" && m.type !== "verb.lasers") return;
    (function run(){
      if(window.__retiring || window.__going) return;
      if(!seatedReady && !window.__verbMode){ setTimeout(run, 400); return; }
      if(m.type === "verb.point") verbPoint(m);
      else if(m.type === "verb.move") verbMove(m);
      else if(m.type === "verb.lasers") verbLasers(m);
      else verbSit(m);
    })();
  };
}

/* answers pushed from the chat: spoken as soon as he is seated */
var seatedReady = false, speakQueue = [];
function handlePush(pl){
  if(!pl || !pl.lede) return;
  if(!seatedReady){ speakQueue.push(pl); return; }
  bubble.classList.add("show"); positionBubble();
  speak(pl.lede, pl.rest||"", pl.receipt||null);
}
if(window.overlay && window.overlay.onSpeak) window.overlay.onSpeak(handlePush);
(function watchSeated(){
  var t = setInterval(function(){
    if(fig.classList.contains("seated") && bubble.classList.contains("show")){
      seatedReady = true; clearInterval(t);
      if(speakQueue.length){ var last = speakQueue.pop(); speakQueue = []; setTimeout(function(){ handlePush(last); }, 1200); }
    }
  }, 300);
})();
})();
</script>
